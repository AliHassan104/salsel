<div class="card">
    <div class="flex justify-content-between mb-3">
        <h1 class=""
            style="color: #93003c; font-size: 19px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; font-weight: 700;">
            Address Details</h1>
    </div>

    <div class="p-fluid p-formgrid grid">
        <!-- Name -->
        <div class="field col-12 md:col-6">
            <label htmlFor="name"><strong>From Country</strong></label>
            <input pInputTextarea id="name" rows="4" [ngModel]="singleAddress?.fromCountry" readonly />
        </div>

        <!-- Account Number -->
        <div class="field col-12 md:col-6">
            <label htmlFor="accountNumber"><strong>To Country</strong></label>
            <input pInputTextarea id="accountNumber" rows="4" [ngModel]="singleAddress?.toCountry" readonly />
        </div>

        <!-- Contact Number -->
        <div class="field col-12 md:col-6">
            <label htmlFor="name"><strong>Product</strong></label>
            <input pInputTextarea id="name" rows="4" [ngModel]="singleAddress?.product" readonly />
        </div>

        <!-- Ref Number -->
        <div class="field col-12 md:col-6">
            <label htmlFor="name"><strong>weightRangeFrom</strong></label>
            <input pInputTextarea id="name" rows="4" [ngModel]="singleAddress?.weightRangeFrom" readonly />
        </div>

        <!-- Address -->
        <div class="field col-12 md:col-6">
            <label htmlFor="name"><strong>weightRangeTo</strong></label>
            <input pInputTextarea id="name" rows="4" [ngModel]="singleAddress?.weightRangeTo" readonly />
        </div>

        <!-- Street Name -->
        <div class="field col-12 md:col-6">
            <label htmlFor="name"><strong>charges</strong></label>
            <input pInputTextarea id="name" rows="4" [ngModel]="singleAddress?.charges" readonly />
        </div>

        <!-- District -->
        <div class="field col-12 md:col-6" *ngIf="singleAddress?.additionalCharges">
            <label htmlFor="name"><strong>Additional Charges</strong></label>
            <input pInputTextarea id="name" rows="4" [ngModel]="singleAddress?.additionalCharges" readonly />
        </div>
    </div>
</div>

<p-toast [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}"></p-toast>
